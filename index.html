<!DOCTYPE html>
<html lang="en">
<head>
<!-- Maybe avoid the whole "double tab" issue? -->
<meta name="viewport" content="initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
* { box-sizing: border-box; }
#sidebar_toggle { display: none; }
body, html { position: absolute; width: 100%; height: 100%; padding: 0; top: 0; left: 0; overflow: hidden; margin: 0; font-family: sans-serif; }
#obscura { position: absolute; width: 100%; height: 100%; left: 0; top: 0; }
#sidepanel { position: absolute; right: -300px; width: 300px; height: 100%; z-index: 1; border-left: 1px solid #999; background: #eee;}
#sidepanel_contents { height: 100%; overflow-y: scroll; }
#sidebar_button { position: absolute; right: 100%; height: top: 0px; background: #999; writing-mode: vertical-rl; padding: 3px; }
#sidebar_toggle:checked ~ #sidepanel { right: 0px; }

.behind { z-index: -1; }
#color_square { position: absolute; top: 80px; left: 80px; display: none; }


#color_preview { height: 24px; background: white; width: 50%; display: inline-block; }
#color_previous { height: 24px; background: #eee; width: 50%; display: inline-block; }
#previous_colors_collection { min-height: 48px; }
#previous_colors_collection div { height: 24px; width: 24px; display: inline-block; }

#brush_box { max-height: 300px; overflow:scroll; }
</style>
</head>
<body>
<input type="checkbox" id="sidebar_toggle" checked></input>

<div id="sidepanel"><label for="sidebar_toggle" id="sidebar_button">Toolbar&nbsp;&#8599;</label><div id="sidepanel_contents">
<button onclick="export_as_svg()">Export SVG</button><button onclick="rerender(CANVAS_MODE)">Rerender</button>
<button onclick="undo()">Undo&nbsp;&olarr;</button><button onclick="redo()">Redo&nbsp;&orarr;</button>

<div style="position: relative;">
<div id="color_preview"></div><div id="color_previous"></div>
<canvas width="210" height="210" id="color_selection_canvas"></canvas>
<h2 class="captionbar">HSV Values</h2>
<input type="text" id="hue" value="0"></input>
<input type="text" id="sat" value="1"></input>
<input type="text" id="val" value="1"></input>
<h2 class="captionbar">Previous Colors</h2>
<div id="previous_colors_collection"></div>
<h2 class="captionbar">Hint</h2>
<p>Color selection is confirmed when left side color bar is clicked on.</p>

</div>
<h2>Brushes</h2>
<div id="brush_box">
</div>
<!--<button onclick="displayBrushOpenDialog()">Upload Brush...</button>-->

<h2>Brush Size</h2>
<input value="1.6" step="0.2" "min="0.8" max="64" type="number" onchange="input_manager.size = this.value"></input>

</div></div>
<canvas id="obscura"></canvas>

<script src="src/pen_input.js"></script>
<script src="src/draw.js"></script>
<script src="src/export.js"></script>
<script src="lib/hsv_picker.js"></script>
<script src="lib/imagetracer_v1.2.6.js"></script>
<script src="src/addons/abr.js"></script>
<script>
version = '0.0.3'
document.title = 'reneeverly sketch-tool v' + version
</script>
</body>
</html>
